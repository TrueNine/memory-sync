<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Feral Rat Variant (Cartoon)</title>
  <desc id="desc">A second fierce cartoon rat with glowing red eyes, hunched over and ready to devour a rotten bloody chunk of meat.</desc>
  <defs>
    <linearGradient id="furA" x1="80" y1="120" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#555761"/>
      <stop offset="0.4" stop-color="#343640"/>
      <stop offset="1" stop-color="#171820"/>
    </linearGradient>
    <linearGradient id="furB" x1="120" y1="200" x2="320" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#777985"/>
      <stop offset="1" stop-color="#2C2F38"/>
    </linearGradient>
    <linearGradient id="meatA" x1="280" y1="260" x2="480" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A1118"/>
      <stop offset="0.5" stop-color="#4A0508"/>
      <stop offset="1" stop-color="#230103"/>
    </linearGradient>
    <linearGradient id="moldA" x1="330" y1="320" x2="440" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#84B966"/>
      <stop offset="1" stop-color="#305E34"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glowRed2" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0
                0 0.08 0 0 0
                0 0 0.08 0 0
                0 0 0 0.95 0" result="red"/>
      <feMerge>
        <feMergeNode in="red"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground stain / shadow -->
  <ellipse cx="256" cy="430" rx="190" ry="42" fill="#0A0A0E" opacity="0.75"/>

  <!-- Rotten meat (different shape) -->
  <g filter="url(#shadow2)">
    <path
      d="M310 282c-26 12-44 40-40 74 4 36 32 66 78 76 52 12 100-10 118-44 18-34 8-74-20-102-24-24-56-34-90-30-18 2-32 10-46 26z"
      fill="url(#meatA)"
      stroke="#120104"
      stroke-width="11"
      stroke-linejoin="round"
    />
    <!-- Deep bite and cracks -->
    <path d="M322 308c18-12 32-16 50-16" stroke="#220206" stroke-width="11" stroke-linecap="round"/>
    <path d="M332 334c22-10 40-12 64-8" stroke="#220206" stroke-width="11" stroke-linecap="round"/>
    <path d="M346 364c26-8 50-6 78 4" stroke="#220206" stroke-width="11" stroke-linecap="round"/>

    <!-- Mold and rot patches -->
    <g opacity="0.92">
      <path
        d="M370 322c20-18 50-18 68-2 18 18 14 46-10 60-24 14-54 10-70-8-14-16-14-32 12-50z"
        fill="url(#moldA)"
        stroke="#17311C"
        stroke-width="9"
        stroke-linejoin="round"
      />
      <path d="M414 302c10-8 26-6 34 4 10 12 8 28-6 34-14 6-30-2-34-14-4-10 0-18 6-24z" fill="#4F8E4B" opacity="0.9"/>
      <path d="M356 392c12-10 30-8 40 6 10 14 6 30-10 36-16 6-34-2-40-14-6-12-4-22 10-28z" fill="#3C7A46" opacity="0.88"/>
      <path d="M446 384c8-10 22-10 30-2 10 10 10 26 0 34-10 8-26 6-34-4-6-8-4-20 4-28z" fill="#305F33" opacity="0.9"/>
    </g>

    <!-- Blood drops -->
    <g>
      <path d="M364 420c-12 20-4 34 10 34 14 0 22-12 14-26-6-12-12-20-24-8z" fill="#A61219" stroke="#1A0203" stroke-width="9" stroke-linejoin="round"/>
      <path d="M408 432c-10 20-2 32 12 32 14 0 22-12 14-26-6-10-12-18-26-6z" fill="#840E14" stroke="#1A0203" stroke-width="9" stroke-linejoin="round"/>
      <path d="M452 412c-10 20-2 32 12 32 14 0 22-12 14-26-6-10-12-18-26-6z" fill="#6C0B10" stroke="#1A0203" stroke-width="9" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Rat (different pose) -->
  <g filter="url(#shadow2)">
    <!-- Tail, more curved -->
    <path
      d="M96 332c-52 6-84 42-90 80"
      stroke="#AE6F71"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M96 332c-52 6-84 42-90 80"
      stroke="#4C2427"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.65"
    />

    <!-- Compact crouched body -->
    <path
      d="M130 332c16-62 66-108 136-122 80-16 154 18 188 74 20 32 20 70 4 102-18 36-58 62-114 66-70 4-134-24-176-68-30-32-46-40-38-52z"
      fill="url(#furA)"
      stroke="#07070C"
      stroke-width="13"
      stroke-linejoin="round"
    />

    <!-- Belly -->
    <path
      d="M176 344c12-38 40-70 82-82 52-14 102 10 126 48 14 22 16 48 4 72-16 34-52 54-100 54-48 0-90-20-112-54-10-16-12-22 0-38z"
      fill="url(#furB)"
      opacity="0.9"
    />

    <!-- Head (more forward, hunched) -->
    <path
      d="M140 244c20-50 72-82 128-82 66 0 118 36 128 92 6 38-10 72-46 92-36 20-86 18-128-2-48-24-84-58-82-100z"
      fill="url(#furA)"
      stroke="#07070C"
      stroke-width="13"
      stroke-linejoin="round"
    />

    <!-- Ears variant -->
    <path d="M168 202c-10-28 8-58 42-62 28-4 54 12 62 36 10 30-12 54-38 56-24 2-52-8-66-30z" fill="#3E3F49" stroke="#07070C" stroke-width="11" stroke-linejoin="round"/>
    <path d="M270 192c0-30 24-52 56-50 24 2 42 20 44 42 2 30-22 46-46 44-24-2-52-18-54-36z" fill="#393A44" stroke="#07070C" stroke-width="11" stroke-linejoin="round"/>
    <path d="M184 200c-6-16 6-32 26-34 16-2 30 8 36 18 6 16-8 28-24 30s-30-4-38-14z" fill="#B27275" opacity="0.9"/>
    <path d="M286 190c-2-14 10-26 28-24 14 2 22 12 24 24 0 16-12 22-26 20-14-2-24-8-26-20z" fill="#B27275" opacity="0.9"/>

    <!-- Eyes (glow) -->
    <g filter="url(#glowRed2)">
      <ellipse cx="210" cy="246" rx="22" ry="16" fill="#F62630" stroke="#5C0A10" stroke-width="8"/>
      <ellipse cx="282" cy="250" rx="22" ry="16" fill="#F62630" stroke="#5C0A10" stroke-width="8"/>
      <circle cx="216" cy="248" r="6" fill="#150000"/>
      <circle cx="288" cy="252" r="6" fill="#150000"/>
      <path d="M192 232c12-12 30-18 50-16" stroke="#07070C" stroke-width="11" stroke-linecap="round"/>
      <path d="M260 236c12-10 30-16 48-12" stroke="#07070C" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- Snout / nose variant -->
    <path
      d="M300 284c20-12 40-12 60 2 16 12 18 30 4 44-18 18-52 18-76 0-16-12-20-30-12-48 6-18 12-26 24-32z"
      fill="#24252E"
      stroke="#07070C"
      stroke-width="13"
      stroke-linejoin="round"
    />
    <circle cx="356" cy="300" r="11" fill="#14141A"/>
    <circle cx="342" cy="314" r="8" fill="#14141A"/>

    <!-- Mouth, more open and dripping -->
    <path
      d="M280 318c18 10 38 12 58 8"
      stroke="#07070C"
      stroke-width="13"
      stroke-linecap="round"
    />
    <path
      d="M252 326c10 34 44 54 92 48"
      fill="#4C060A"
      stroke="#07070C"
      stroke-width="13"
      stroke-linejoin="round"
    />
    <path d="M262 340l18-10 10 20-14 10-14-20z" fill="#F4F0E8" stroke="#07070C" stroke-width="7" stroke-linejoin="round"/>
    <path d="M292 348l18-10 12 20-16 10-14-20z" fill="#F4F0E8" stroke="#07070C" stroke-width="7" stroke-linejoin="round"/>
    <path d="M322 350l18-10 12 20-16 10-14-20z" fill="#F4F0E8" stroke="#07070C" stroke-width="7" stroke-linejoin="round"/>
    <path d="M282 378c16 8 32 10 50 6" stroke="#2E0204" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
    <path d="M284 366c10 8 22 10 34 8" stroke="#F26A78" stroke-width="10" stroke-linecap="round"/>
    <!-- Drooling blood -->
    <path d="M306 382c-4 18 0 30 10 34" stroke="#A01018" stroke-width="9" stroke-linecap="round"/>

    <!-- Whiskers, more chaotic -->
    <path d="M298 296c-32-16-66-16-100 0" stroke="#CBCBD4" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M300 310c-36-8-70-4-100 18" stroke="#CBCBD4" stroke-width="6" stroke-linecap="round" opacity="0.82"/>
    <path d="M302 326c-32 10-58 26-80 50" stroke="#CBCBD4" stroke-width="6" stroke-linecap="round" opacity="0.78"/>

    <!-- Arms clutching meat -->
    <path
      d="M268 362c14 8 26 18 34 30 10 16 18 20 36 14 20-6 40-22 52-44"
      stroke="#07070C"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M236 366c12 8 22 18 26 30 8 20 18 26 38 22 26-4 52-22 68-42"
      stroke="#07070C"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.95"
    />
    <g>
      <path d="M344 396l20-8-2 22-20 8 2-22z" fill="#D5CCC3" stroke="#07070C" stroke-width="9" stroke-linejoin="round"/>
      <path d="M366 384l20-12 4 24-20 12-4-24z" fill="#D5CCC3" stroke="#07070C" stroke-width="9" stroke-linejoin="round"/>
      <path d="M392 366l20-14 4 24-20 14-4-24z" fill="#D5CCC3" stroke="#07070C" stroke-width="9" stroke-linejoin="round"/>
    </g>

    <!-- Scars / grime -->
    <path d="M156 294c16-18 38-30 64-34" stroke="#07070C" stroke-width="11" stroke-linecap="round" opacity="0.7"/>
    <path d="M192 322c20-10 44-14 68-10" stroke="#07070C" stroke-width="11" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
