version: 2
updates:
  # GitHub Actions version updates are scoped by GitHub to `directory: /`.
  # This checks workflow files under `/.github/workflows` on the `dev` branch.
  # Composite actions under `/.github/actions/*/action.yml` are not separately
  # configurable for Dependabot version updates in `dependabot.yml`.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      cargo-workspace:
        patterns:
          - '*'

  # This repo uses a shared pnpm workspace lockfile plus `catalog:` versions.
  # Keep npm updates in a single workspace-level Dependabot entry so manifests
  # resolve against the same root context instead of as isolated packages.
  - package-ecosystem: npm
    directories:
      - /
      - /cli
      - /sdk
      - /mcp
      - /gui
      - /doc
      - /libraries/*
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    groups:
      npm-workspace:
        patterns:
          - '*'
