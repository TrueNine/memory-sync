version: 2
updates:
  # GitHub Actions version updates are scoped by GitHub to `directory: /`.
  # This checks workflow files under `/.github/workflows` on the `dev` branch.
  # Composite actions under `/.github/actions/*/action.yml` are not separately
  # configurable for Dependabot version updates in `dependabot.yml`.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      cargo-workspace:
        patterns:
          - '*'

