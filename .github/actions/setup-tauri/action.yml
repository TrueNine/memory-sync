name: Setup Tauri Build
description: Common Tauri GUI build setup - cargo cache with deps-only hash, version sync, route generation

inputs:
  rust-version:
    description: Rust toolchain version
    required: false
    default: "1.93.1"
  rust-targets:
    description: Rust targets to install (comma-separated)
    required: false
    default: ""
  signing-private-key:
    description: Tauri updater signing private key content
    required: false
    default: ""
  signing-private-key-password:
    description: Tauri updater signing private key password
    required: false
    default: ""
  version:
    description: Version string to sync into Cargo.toml and tauri.conf.json
    required: true

runs:
  using: composite
  steps:
    - name: Cache Linux package archives
      if: runner.os == 'Linux'
      uses: actions/cache@v5
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-tauri-apt-${{ hashFiles('.github/actions/setup-tauri/action.yml') }}
        restore-keys: |
          ${{ runner.os }}-tauri-apt-

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev \
          libglib2.0-dev \
          pkg-config \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf \
          libssl-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-version }}
        components: rustfmt
        targets: ${{ inputs.rust-targets }}

    - name: Normalize Tauri signing key
      if: ${{ inputs.signing-private-key != '' }}
      shell: pwsh
      env:
        RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-private-key }}
      run: |
        $normalized = $env:RAW_TAURI_SIGNING_PRIVATE_KEY.TrimStart([char]0xFEFF)
        "TAURI_SIGNING_PRIVATE_KEY<<EOF" >> $env:GITHUB_ENV
        $normalized >> $env:GITHUB_ENV
        "EOF" >> $env:GITHUB_ENV

    - name: Normalize Tauri signing key password
      if: ${{ inputs.signing-private-key-password != '' }}
      shell: pwsh
      env:
        RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-private-key-password }}
      run: |
        $normalized = $env:RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD.TrimStart([char]0xFEFF).TrimEnd("`r", "`n")
        "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF" >> $env:GITHUB_ENV
        $normalized >> $env:GITHUB_ENV
        "EOF" >> $env:GITHUB_ENV

    - name: Generate ephemeral Tauri signing key
      if: ${{ inputs.signing-private-key == '' }}
      shell: bash
      run: |
        set -euo pipefail

        key_path="${RUNNER_TEMP}/tauri-ci.key"
        pnpm -C gui tauri signer generate --ci --force -w "$key_path"

        {
          echo "TAURI_SIGNING_PRIVATE_KEY<<EOF"
          cat "$key_path"
          echo "EOF"
        } >> "$GITHUB_ENV"
        echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

    - name: Get Cargo deps hash (exclude root package version for stable cache key)
      id: cargo-deps-hash
      shell: bash
      run: |
        HASH=$(awk '/^name = "memory-sync-gui"$/{print; getline; sub(/version = ".*"/, "version = \"0.0.0\""); print; next} 1' gui/src-tauri/Cargo.lock | openssl dgst -sha256 2>&1 | awk '{print $NF}')
        echo "hash=$HASH" >> $GITHUB_OUTPUT

    - name: Cache cargo + tauri target
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          gui/target
        key: ${{ runner.os }}-cargo-${{ inputs.rust-version }}-${{ steps.cargo-deps-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.rust-version }}-
          ${{ runner.os }}-cargo-

    - name: Sync Tauri version
      shell: bash
      run: |
        version="${{ inputs.version }}"
        sed -i.bak "s/^version = \".*\"/version = \"${version}\"/" gui/src-tauri/Cargo.toml
        rm -f gui/src-tauri/Cargo.toml.bak
        jq --arg v "$version" '.version = $v' gui/src-tauri/tauri.conf.json > gui/src-tauri/tauri.conf.tmp && mv gui/src-tauri/tauri.conf.tmp gui/src-tauri/tauri.conf.json
        echo "Synced version to ${version}"

    - name: Generate route tree
      shell: bash
      run: pnpm -F @truenine/memory-sync-gui run generate:routes

    - name: Clean old bundle artifacts
      shell: bash
      run: |
        if [ -d "gui/target" ]; then
          find gui/target -type d -name bundle -prune -exec rm -rf {} +
        fi
