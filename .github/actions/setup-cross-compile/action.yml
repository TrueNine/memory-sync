name: Setup Cross-Compile Toolchains
description: Install cross-compilation toolchains for Rust targets

inputs:
  targets:
    description: Comma-separated list of targets to setup (e.g., aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu)
    required: false
    default: "aarch64-unknown-linux-gnu"

runs:
  using: composite
  steps:
    - name: Parse targets
      id: parse
      shell: bash
      run: |
        TARGETS="${{ inputs.targets }}"
        echo "targets=$TARGETS" >> $GITHUB_OUTPUT
        
        NEED_AARCH64_LINUX=false
        NEED_X86_64_LINUX=false
        NEED_ARM_LINUX=false
        
        if echo "$TARGETS" | grep -q "aarch64-unknown-linux-gnu"; then
          NEED_AARCH64_LINUX=true
        fi
        if echo "$TARGETS" | grep -q "x86_64-unknown-linux-gnu"; then
          NEED_X86_64_LINUX=true
        fi
        if echo "$TARGETS" | grep -q "armv7-unknown-linux-gnueabihf"; then
          NEED_ARM_LINUX=true
        fi
        
        echo "need_aarch64_linux=$NEED_AARCH64_LINUX" >> $GITHUB_OUTPUT
        echo "need_x86_64_linux=$NEED_X86_64_LINUX" >> $GITHUB_OUTPUT
        echo "need_arm_linux=$NEED_ARM_LINUX" >> $GITHUB_OUTPUT

    - name: Install aarch64-linux toolchain
      if: steps.parse.outputs.need_aarch64_linux == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Install x86_64-linux toolchain
      if: steps.parse.outputs.need_x86_64_linux == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-x86_64-linux-gnu g++-x86_64-linux-gnu
        echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=x86_64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Install armv7-linux toolchain
      if: steps.parse.outputs.need_arm_linux == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
