name: Setup Bun
description: Setup the pinned Bun runtime and optionally install TNMSOP dependencies

inputs:
  bun-version:
    description: Bun version
    required: false
    default: "1.3.14"
  install:
    description: Whether to install dependencies
    required: false
    default: "true"
  working-directory:
    description: Directory containing bun.lock
    required: false
    default: croessweave-obsidian-plugin

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install Bun dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile --cwd "$BUN_WORKING_DIRECTORY"
      env:
        BUN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
