name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"
          install: "true"

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi

          if [[ -z "$version" ]]; then
            echo "::error::Release version is empty."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate version surfaces
        run: bun scripts/shared/check-version-surfaces.ts "${{ steps.release-version.outputs.version }}"

      - name: Validate existing release tag targets
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          for tag in "v${{ steps.release-version.outputs.version }}"; do
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
              if [[ "$tag_commit" != "${GITHUB_SHA}" ]]; then
                echo "::error::Existing tag ${tag} points to ${tag_commit}, expected ${GITHUB_SHA}."
                exit 1
              fi
            fi
          done

  build-cli-binaries:
    needs: validate-version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            binary: tnmsc
            archive: tnmsc-linux-x86_64.tar.gz
          - os: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            binary: tnmsc
            archive: tnmsc-linux-aarch64.tar.gz
            cross: true
          - os: macos-14
            rust_target: aarch64-apple-darwin
            suffix: darwin-arm64
            binary: tnmsc
            archive: tnmsc-darwin-aarch64.tar.gz
          - os: macos-14
            rust_target: x86_64-apple-darwin
            suffix: darwin-x64
            binary: tnmsc
            archive: tnmsc-darwin-x86_64.tar.gz
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            binary: tnmsc.exe
            archive: tnmsc-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: release-cli-${{ matrix.rust_target }}

      - name: Setup cross-compile
        if: matrix.cross
        uses: ./.github/actions/setup-cross-compile

      - name: Build tnmsc binary
        run: cargo build --release --target ${{ matrix.rust_target }} -p tnmsc

      - name: Run native tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.rust_target }} -p tnmsc

      - name: Package binaries (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          raw_dir="cli-artifacts/${{ matrix.suffix }}"
          binary_path="target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
          mkdir -p "$raw_dir"
          cp "$binary_path" "$raw_dir/"
          node -e 'const fs=require("node:fs"); const size=fs.statSync(process.argv[1]).size; if (size < 131072) { throw new Error(`Binary too small: ${size}`) }' "$raw_dir/${{ matrix.binary }}"
          tar czf "${{ matrix.archive }}" -C "$raw_dir" "${{ matrix.binary }}"

      - name: Package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rawDir = "cli-artifacts/${{ matrix.suffix }}"
          $binaryPath = "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
          New-Item -ItemType Directory -Force -Path $rawDir | Out-Null
          Copy-Item $binaryPath "$rawDir/${{ matrix.binary }}"
          node -e "const fs=require('node:fs'); const size=fs.statSync(process.argv[1]).size; if (size < 131072) { throw new Error('Binary too small: ' + size) }" "$rawDir/${{ matrix.binary }}"
          Compress-Archive -Path "$rawDir/*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-${{ matrix.suffix }}
          path: cli-artifacts/${{ matrix.suffix }}/
          if-no-files-found: error

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-archive-${{ matrix.suffix }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  build-mcp-binaries:
    needs: validate-version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            binary: tnmsm
            archive: croessweave-mcp-linux-x86_64.tar.gz
          - os: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            binary: tnmsm
            archive: croessweave-mcp-linux-aarch64.tar.gz
            cross: true
          - os: macos-14
            rust_target: aarch64-apple-darwin
            suffix: darwin-arm64
            binary: tnmsm
            archive: croessweave-mcp-darwin-aarch64.tar.gz
          - os: macos-14
            rust_target: x86_64-apple-darwin
            suffix: darwin-x64
            binary: tnmsm
            archive: croessweave-mcp-darwin-x86_64.tar.gz
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            binary: tnmsm.exe
            archive: croessweave-mcp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: release-mcp-${{ matrix.rust_target }}

      - name: Setup cross-compile
        if: matrix.cross
        uses: ./.github/actions/setup-cross-compile

      - name: Build tnmsm binary
        run: cargo build --release --target ${{ matrix.rust_target }} -p tnmsm

      - name: Run native tests
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.rust_target }} -p tnmsm

      - name: Package binaries (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          raw_dir="mcp-artifacts/${{ matrix.suffix }}"
          binary_path="target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
          mkdir -p "$raw_dir"
          cp "$binary_path" "$raw_dir/"
          node -e 'const fs=require("node:fs"); const size=fs.statSync(process.argv[1]).size; if (size < 131072) { throw new Error(`Binary too small: ${size}`) }' "$raw_dir/${{ matrix.binary }}"
          tar czf "${{ matrix.archive }}" -C "$raw_dir" "${{ matrix.binary }}"

      - name: Package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rawDir = "mcp-artifacts/${{ matrix.suffix }}"
          $binaryPath = "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}"
          New-Item -ItemType Directory -Force -Path $rawDir | Out-Null
          Copy-Item $binaryPath "$rawDir/${{ matrix.binary }}"
          node -e "const fs=require('node:fs'); const size=fs.statSync(process.argv[1]).size; if (size < 131072) { throw new Error('Binary too small: ' + size) }" "$rawDir/${{ matrix.binary }}"
          Compress-Archive -Path "$rawDir/*" -DestinationPath "${{ matrix.archive }}"

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-binary-${{ matrix.suffix }}
          path: mcp-artifacts/${{ matrix.suffix }}/
          if-no-files-found: error

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-archive-${{ matrix.suffix }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish-cli-npm:
    needs: [validate-version, build-cli-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-cli-publish

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Preflight npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is missing."
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          pushd "$tmp_dir" >/dev/null
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm whoami --registry "${NPM_REGISTRY_URL}"
          popd >/dev/null

      - name: Download raw CLI binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: cli-binary-*

      - name: Assemble CLI npm package contents
        run: cargo run -p tnmsc --bin tnmsc -- assemble-npm --artifacts-dir artifacts

      - name: Validate platform packages
        shell: bash
        run: |
          set -euo pipefail
          for target_dir in cli/npm/*/; do
            if [[ ! -f "${target_dir}package.json" ]]; then
              echo "::error::Missing ${target_dir}package.json"
              exit 1
            fi
            if ! find "${target_dir}bin" -type f \( -name 'tnmsc' -o -name 'tnmsc.exe' \) | grep -q .; then
              echo "::error::Missing binary in ${target_dir}"
              exit 1
            fi
          done

      - name: Publish CLI platform packages
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: cli/npm

      - name: Build CLI package
        run: cargo build --release -p tnmsc

      - name: Smoke test CLI main package
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT
          pnpm -C cli pack --pack-destination "$pack_dir"
          cli_tarball="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$cli_tarball"
          npm install -g "$cli_tarball"
          command -v tnmsc
          tnmsc help >/tmp/tnmsc-help.txt
          grep -q 'install' /tmp/tnmsc-help.txt

      - name: Publish CLI package
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: cli

  publish-mcp-npm:
    needs: [validate-version, build-mcp-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-mcp-publish

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Preflight npm auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is missing."
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          pushd "$tmp_dir" >/dev/null
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm whoami --registry "${NPM_REGISTRY_URL}"
          popd >/dev/null

      - name: Download raw MCP binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mcp-binary-*

      - name: Assemble MCP npm package contents
        run: cargo run -p tnmsm --bin tnmsm -- assemble-npm --artifacts-dir artifacts

      - name: Validate platform packages
        shell: bash
        run: |
          set -euo pipefail
          for target_dir in mcp/npm/*/; do
            if [[ ! -f "${target_dir}package.json" ]]; then
              echo "::error::Missing ${target_dir}package.json"
              exit 1
            fi
            if ! find "${target_dir}bin" -type f \( -name 'tnmsm' -o -name 'tnmsm.exe' \) | grep -q .; then
              echo "::error::Missing binary in ${target_dir}"
              exit 1
            fi
          done

      - name: Publish MCP platform packages
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: mcp/npm

      - name: Build MCP package
        run: cargo build --release -p tnmsm

      - name: Smoke test MCP main package
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT
          pnpm -C mcp pack --pack-destination "$pack_dir"
          mcp_tarball="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$mcp_tarball"
          npm install -g "$mcp_tarball"
          command -v tnmsm
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | tnmsm >/tmp/tnmsm-initialize.json
          grep -q '"jsonrpc":"2.0"' /tmp/tnmsm-initialize.json

      - name: Publish MCP package
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: mcp

  build-tnmsop:
    needs: validate-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-bun

      - name: Test and validate TNMSOP
        working-directory: croessweave-obsidian-plugin
        run: |
          bun test
          bun run check:type
          bun run lint

      - name: Build and package TNMSOP
        working-directory: croessweave-obsidian-plugin
        run: |
          bun run build
          bun run package:release
          bun run verify:dist

      - name: Upload TNMSOP release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tnmsop-release
          path: croessweave-obsidian-plugin/dist/
          if-no-files-found: error

  create-github-release:
    needs: [validate-version, build-cli-binaries, publish-cli-npm, build-mcp-binaries, publish-mcp-npm, build-tnmsop]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download CLI archive artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/cli
          pattern: cli-archive-*
          merge-multiple: true

      - name: Download MCP archive artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/mcp
          pattern: mcp-archive-*
          merge-multiple: true

      - name: Download TNMSOP artifacts
        uses: actions/download-artifact@v8
        with:
          name: tnmsop-release
          path: artifacts/obsidian

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          cli_archive_count=$(find artifacts/cli -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          mcp_archive_count=$(find artifacts/mcp -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          obsidian_archive_count=$(find artifacts/obsidian -maxdepth 1 -type f -name 'tnmsop-${{ needs.validate-version.outputs.version }}.zip' | wc -l | tr -d ' ')

          if [[ "$cli_archive_count" -ne 5 ]]; then
            echo "::error::Expected 5 CLI archives, found ${cli_archive_count}."
            exit 1
          fi

          if [[ "$mcp_archive_count" -ne 5 ]]; then
            echo "::error::Expected 5 MCP archives, found ${mcp_archive_count}."
            exit 1
          fi

          if [[ "$obsidian_archive_count" -ne 1 ]]; then
            echo "::error::Expected one TNMSOP archive, found ${obsidian_archive_count}."
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ needs.validate-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.validate-version.outputs.version }}
          files: |
            artifacts/cli/**/*.tar.gz
            artifacts/cli/**/*.zip
            artifacts/mcp/**/*.tar.gz
            artifacts/mcp/**/*.zip
            artifacts/obsidian/tnmsop-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
