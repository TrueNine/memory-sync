name: Build GUI All Platforms

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-all:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            rust-targets: ''
            tauri-command: pnpm tauri build
          - os: ubuntu-24.04
            platform: linux
            rust-targets: ''
            tauri-command: pnpm tauri build
          - os: macos-14
            platform: macos
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-command: pnpm tauri build --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-tauri
        with:
          rust-targets: ${{ matrix.rust-targets }}
          version: ${{ inputs.version }}

      - name: Build GUI
        working-directory: ./gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.tauri-command }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/*/release/bundle/**/*.exe
            gui/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/*/release/bundle/**/*.AppImage
            gui/src-tauri/target/*/release/bundle/**/*.deb
            gui/src-tauri/target/*/release/bundle/**/*.rpm
            gui/src-tauri/target/release/bundle/**/*.AppImage
            gui/src-tauri/target/release/bundle/**/*.deb
            gui/src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}
          path: |
            gui/src-tauri/target/*/release/bundle/**/*.dmg
            gui/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
