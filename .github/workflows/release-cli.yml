name: Release Packages

env:
  NPM_REGISTRY_URL: https://registry.npmjs.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/workflows/build-gui-all.yml
      - .github/workflows/release-*.yml
      - assets/**
      - cli/**
      - mcp/**
      - gui/**
      - sdk/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      publish_cli: ${{ steps.npm-check.outputs.publish_cli }}
      publish_npm: ${{ steps.npm-check.outputs.publish_npm }}
      version: ${{ steps.npm-check.outputs.version }}
      gui_should_release: ${{ steps.gui-check.outputs.should_release }}
      gui_version: ${{ steps.gui-check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"
          install: "false"

      - name: Check npm packages release state
        id: npm-check
        uses: ./.github/actions/check-release-state
        with:
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      - name: Check GUI release state
        id: gui-check
        uses: ./.github/actions/check-gui-release-state
        with:
          github-token: ${{ github.token }}

  build-binaries:
    needs: preflight
    if: needs.preflight.outputs.publish_cli == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            binary: tnmsc
          - os: ubuntu-24.04
            rust_target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            binary: tnmsc
            cross: true
          - os: macos-14
            rust_target: aarch64-apple-darwin
            suffix: darwin-arm64
            binary: tnmsc
          - os: macos-14
            rust_target: x86_64-apple-darwin
            suffix: darwin-x64
            binary: tnmsc
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            binary: tnmsc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust_target }}
          cache-key: cli-${{ matrix.rust_target }}
      - name: Setup cross-compile
        if: matrix.cross
        uses: ./.github/actions/setup-cross-compile
      - name: Build tnmsc binary (release)
        run: cargo build --release --target ${{ matrix.rust_target }} -p tnmsc-cli-shell
      - name: Run tests (native only)
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.rust_target }} -p tnmsc-cli-shell
      - name: Copy binary into platform package
        shell: bash
        run: |
          target_dir="cli/.artifacts/${{ matrix.suffix }}"
          mkdir -p "$target_dir"
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "$target_dir/"
          ls -la "$target_dir/"
      - name: Validate binary size and format
        shell: bash
        run: |
          target_dir="cli/.artifacts/${{ matrix.suffix }}"
          binary_path="${target_dir}/${{ matrix.binary }}"
          min_size=$((128 * 1024))
          size=$(stat -c%s "$binary_path" 2>/dev/null || stat -f%z "$binary_path" 2>/dev/null || echo 0)
          if [ "$size" -lt "$min_size" ]; then
            echo "ERROR: ${binary_path} is too small (${size} bytes), expected at least ${min_size} bytes"
            exit 1
          fi
          file_output=$(file "$binary_path")
          echo "File info for ${binary_path}: ${file_output}"
          if [[ "$file_output" == *"ELF"* ]] || [[ "$file_output" == *"Mach-O"* ]] || [[ "$file_output" == *"PE"* ]]; then
            echo "OK: valid native binary"
          else
            echo "WARNING: format could not be verified as ELF/Mach-O/PE"
          fi
      - name: Upload platform package artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-binary-${{ matrix.suffix }}
          path: cli/.artifacts/${{ matrix.suffix }}/
          if-no-files-found: error

  publish-platform-packages:
    needs: [preflight, build-binaries]
    if: needs.preflight.outputs.publish_cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cli-publish-platform-packages
      - uses: ./.github/actions/setup-node-pnpm
        with:
          install: "true"
          registry-url: https://registry.npmjs.org/
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: cli-binary-*
      - name: Assemble CLI npm package contents
        run: cargo run --manifest-path cli/Cargo.toml --bin tnmsc -- assemble-npm --artifacts-dir artifacts
      - name: Validate platform packages
        shell: bash
        run: |
          for target_dir in cli/npm/*/; do
            if [ ! -f "${target_dir}package.json" ]; then
              echo "ERROR: missing ${target_dir}package.json"
              exit 1
            fi
            if ! find "${target_dir}bin" -type f \( -name 'tnmsc' -o -name 'tnmsc.exe' \) | grep -q .; then
              echo "ERROR: missing binary in ${target_dir}"
              exit 1
            fi
          done
      - name: Publish CLI platform sub-packages
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: cli/npm

  publish-npm-packages:
    needs: [preflight, publish-platform-packages]
    if: |
      needs.preflight.outputs.publish_npm == 'true' &&
      (needs.publish-platform-packages.result == 'success' || needs.publish-platform-packages.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cli-publish-main-package
      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: https://registry.npmjs.org/

      - name: Preflight CLI publish
        if: needs.preflight.outputs.publish_cli == 'true'
        uses: ./.github/actions/npm-auth-preflight
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: cli
          package-name: "@truenine/memory-sync-cli"

      - name: Download all platform artifacts
        if: needs.preflight.outputs.publish_cli == 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: cli-binary-*

      - name: Assemble CLI npm package contents
        if: needs.preflight.outputs.publish_cli == 'true'
        run: cargo run --manifest-path cli/Cargo.toml --bin tnmsc -- assemble-npm --artifacts-dir artifacts

      - name: Build CLI
        if: needs.preflight.outputs.publish_cli == 'true'
        run: pnpm -F @truenine/memory-sync-cli run build

      - name: Publish CLI
        if: needs.preflight.outputs.publish_cli == 'true'
        uses: ./.github/actions/npm-publish-package
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
          package-dir: cli

  build-binary-archives:
    needs: [preflight, publish-platform-packages]
    if: |
      (needs.preflight.outputs.publish_cli == 'true' || needs.preflight.outputs.gui_should_release == 'true') &&
      (needs.publish-platform-packages.result == 'success' || needs.publish-platform-packages.result == 'skipped')
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: tnmsc
            archive: tnmsc-linux-x86_64.tar.gz
          - platform: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            binary: tnmsc
            archive: tnmsc-linux-aarch64.tar.gz
            cross: true
          - platform: macos-14
            target: aarch64-apple-darwin
            binary: tnmsc
            archive: tnmsc-darwin-aarch64.tar.gz
          - platform: macos-14
            target: x86_64-apple-darwin
            binary: tnmsc
            archive: tnmsc-darwin-x86_64.tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tnmsc.exe
            archive: tnmsc-windows-x86_64.zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: cli-${{ matrix.target }}
      - name: Setup cross-compile
        if: matrix.cross
        uses: ./.github/actions/setup-cross-compile
      - name: Build tnmsc binary (release)
        run: cargo build --release --target ${{ matrix.target }} -p tnmsc-cli-shell
      - name: Run tests (native only)
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }} -p tnmsc-cli-shell
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          cd staging
          tar czf ../${{ matrix.archive }} *
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.archive }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  build-gui-all:
    needs: [preflight]
    if: needs.preflight.outputs.gui_should_release == 'true'
    uses: ./.github/workflows/build-gui-all.yml
    with:
      version: ${{ needs.preflight.outputs.gui_version }}
    secrets: inherit

  release-gui-collect:
    needs: [preflight, build-gui-all, build-binary-archives]
    if: needs.preflight.outputs.gui_should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-gui-collect.yml
    with:
      version: ${{ needs.preflight.outputs.gui_version }}
    secrets: inherit
