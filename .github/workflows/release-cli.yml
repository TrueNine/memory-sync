name: Release CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-22.04
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version changes
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=false
          files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'cli/package.json')

          if [[ -n "$files" ]]; then
            while IFS= read -r file; do
              prev=$(git show "${{ github.event.before }}:$file" 2>/dev/null || true)
              curr=$(cat "$file" 2>/dev/null || true)

              if [[ -z "$prev" || -z "$curr" ]]; then
                changed=true
                break
              fi

              prev_ver=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('version',''))" <<<"$prev")
              curr_ver=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('version',''))" <<<"$curr")

              if [[ "$prev_ver" != "$curr_ver" ]]; then
                changed=true
                echo "version=$curr_ver" >> "$GITHUB_OUTPUT"
                break
              fi
            done <<< "$files"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          version=$(jq -r '.version' cli/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-cli:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install

      - name: Build CLI
        run: pnpm -F @truenine/memory-sync-cli run build

      - name: Publish to npm
        working-directory: ./cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
