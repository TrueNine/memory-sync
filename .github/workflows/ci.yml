name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      obsidian: ${{ steps.filter.outputs.obsidian }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - 'doc/**'
              - '.github/actions/setup-node-pnpm/action.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docs.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'xtask/**'
            obsidian:
              - 'tnmsop'
              - 'croessweave-obsidian-plugin/**'
              - 'manifest.json'
              - 'versions.json'
              - '.githooks/sync-versions.ts'
              - '.githooks/sync-versions.test.ts'
              - 'scripts/shared/check-version-surfaces.ts'
              - '.github/actions/setup-bun/action.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'package.json'

  version-surfaces:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-bun
        with:
          install: "false"

      - name: Test version synchronization
        run: bun test ./.githooks/sync-versions.test.ts

      - name: Validate current version surfaces
        shell: bash
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          bun scripts/shared/check-version-surfaces.ts "$version"

  validate-monorepo:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci

      - name: Lint
        run: cargo run -p xtask -- lint

      - name: Typecheck
        run: cargo run -p xtask -- check-type

      - name: Build
        run: cargo run -p xtask -- build

      - name: Rust unit tests
        run: cargo test --workspace --exclude tnmsg --exclude tnmsc-local-tests --lib --bins

  packaging-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-packaging-smoke

      - name: Build release binaries (for packaging smoke)
        run: cargo build --release -p tnmsc -p tnmsm

      - name: CLI packaging smoke
        shell: bash
        run: |
          set -euo pipefail
          target/release/tnmsc assemble-npm --profile release

          pack_dir="$(mktemp -d)"
          prefix_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir" "$prefix_dir"' EXIT
          pnpm -C cli/npm/linux-x64-gnu pack --pack-destination "$pack_dir"
          pnpm -C cli pack --pack-destination "$pack_dir"

          platform_tarballs=("$pack_dir"/truenine-croessweave-cli-linux-x64-gnu-*.tgz)
          main_tarballs=("$pack_dir"/truenine-croessweave-cli-[0-9]*.tgz)
          npm install --global --prefix "$prefix_dir" "${platform_tarballs[0]}" "${main_tarballs[0]}" --ignore-scripts
          "$prefix_dir/bin/tnmsc" help >"$pack_dir/tnmsc-help.txt"
          grep -q 'install' "$pack_dir/tnmsc-help.txt"

      - name: MCP packaging smoke
        shell: bash
        run: |
          set -euo pipefail
          target/release/tnmsm assemble-npm --profile release

          pack_dir="$(mktemp -d)"
          prefix_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir" "$prefix_dir"' EXIT
          pnpm -C mcp/npm/linux-x64-gnu pack --pack-destination "$pack_dir"
          pnpm -C mcp pack --pack-destination "$pack_dir"

          platform_tarballs=("$pack_dir"/truenine-croessweave-mcp-linux-x64-gnu-*.tgz)
          main_tarballs=("$pack_dir"/truenine-croessweave-mcp-[0-9]*.tgz)
          npm install --global --prefix "$prefix_dir" "${platform_tarballs[0]}" "${main_tarballs[0]}" --ignore-scripts
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | "$prefix_dir/bin/tnmsm" >"$pack_dir/tnmsm-initialize.json"
          grep -q '"jsonrpc":"2.0"' "$pack_dir/tnmsm-initialize.json"

  docs-check:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm
        with:
          install-filter: "@truenine/croessweave-docs..."

      - name: Validate docs content
        run: pnpm -C doc run validate:content

      - name: Lint docs
        run: pnpm -C doc run lint

      - name: Typecheck docs
        run: pnpm -C doc run check:type

      - name: Build docs
        run: pnpm -C doc run build

  tnmsop-check:
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.obsidian == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-bun

      - name: Test TNMSOP
        run: bun test
        working-directory: croessweave-obsidian-plugin

      - name: Typecheck TNMSOP
        run: bun run check:type
        working-directory: croessweave-obsidian-plugin

      - name: Lint TNMSOP
        run: bun run lint
        working-directory: croessweave-obsidian-plugin

      - name: Build and package TNMSOP
        run: |
          bun run build
          bun run package:release
          bun run verify:dist
        working-directory: croessweave-obsidian-plugin
