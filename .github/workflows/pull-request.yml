name: Pull Request

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - .attachments/**
      - AGENTS.md
      - CLAUDE.md
      - GEMINI.md
      - README.md
      - CODE_OF_CONDUCT.md
      - LICENSE
      - SECURITY.md
      - doc/**
      - .github/workflows/deploy-doc.yml
      - .github/workflows/pull-request-doc.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-preflight:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm
        with:
          cache: "false"
          install: "false"

      - name: Run npm release preflight
        uses: ./.github/actions/check-release-state
        with:
          registry-url: https://registry.npmjs.org/

  gui-release-preflight:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run GUI release preflight
        uses: ./.github/actions/check-gui-release-state
        with:
          github-token: ${{ github.token }}

  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pr

      - name: Build native modules
        run: pnpm run build:native

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check:type

      - name: Run tests
        run: pnpm run test

      - name: Rust tests (excluding GUI)
        run: cargo test --workspace --exclude memory-sync-gui --lib --bins --tests
