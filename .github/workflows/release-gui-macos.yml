name: Debug GUI macOS Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rebuild for debugging (without v prefix, e.g. 2026.10213.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-gui-macos-debug:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - uses: ./.github/actions/setup-tauri
        with:
          rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          version: ${{ inputs.version }}

      - name: Build GUI
        working-directory: ./gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: List bundle output (debug)
        shell: bash
        run: |
          echo "=== Finding all bundle artifacts ==="
          find target -path '*/bundle/*' -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) 2>/dev/null || echo 'No bundle files found'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-gui-macos-14
          path: |
            target/*/release/bundle/**/*.dmg
            target/*/release/bundle/**/*.tar.gz
            target/*/release/bundle/**/*.sig
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.sig
          if-no-files-found: error
