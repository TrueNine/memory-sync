---
name: Bug Report
about: 报告一个问题或错误
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的 bug 报告！请填写以下信息帮助我们快速定位问题。

  - type: input
    id: version
    attributes:
      label: 版本
      description: 你正在使用的版本
      placeholder: 例如：2026.10212.0
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: 涉及包
      description: 哪个包出现了问题？
      options:
        - cli
        - gui
        - desk-paths
        - init-bundle
        - logger
        - md-compiler
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述问题
      placeholder: 发生了什么？
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 执行 '...'
        2. 输入 '...'
        3. 出现错误
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
      placeholder: 清晰简洁地描述你期望的结果

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？
      placeholder: 包括完整的错误日志或截图

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Node 版本等信息
      placeholder: 例如：Ubuntu 22.04, Node.js 25.2.1
