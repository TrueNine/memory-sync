---
name: Feature Request
about: 建议一个新功能
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请填写以下信息帮助我们理解你的需求。

  - type: textarea
    id: problem
    attributes:
      label: 问题/需求背景
      description: 你的功能请求是为了解决什么问题？
      placeholder: 清晰简洁地描述问题或需求背景
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望如何实现这个功能？
      placeholder: 清晰简洁地描述你想要的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
      placeholder: 描述你考虑过的其他解决方案

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 任何其他上下文信息
      placeholder: 截图、用例场景、相关链接等
