name: Feature Request
description: Suggest an idea for memory-sync (tnmsc CLI / GUI)
labels: ["pending-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please [search and confirm](https://github.com/TrueNine/memory-sync/issues?q=is%3Aissue+is%3Aopen+sort%3Aupdated-desc) that the idea does not yet exist. Duplicate requests may be closed.

        ---
  - type: checkboxes
    id: confirm
    attributes:
      label: Before opening, please confirm
      options:
        - label: I searched for an existing request or discussion first
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Choose the closest part of the product
      options:
        - CLI (tnmsc)
        - Shared Rust / N-API libraries
        - GUI (Tauri app)
        - Docs or onboarding
        - Multiple / unsure
    validations:
      required: true
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What problem does this solve and how should it work?
      placeholder: "Describe the challenge and your suggested feature (e.g., new output plugin, config option, CLI flag)."
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: How would you use this feature?
      placeholder: "Concrete examples: which target (Cursor/Kiro/Warp/…), which input source, typical workflow."
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: Current workaround
      description: If you already have a manual workaround, describe it
      placeholder: "Explain how you are handling this today, and what is still painful."
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant details
      placeholder: "Screenshots, config examples, or technical details that might help."
    validations:
      required: false
