[package]
name = "tnmsm"
description = "MCP stdio server for managing memory-sync prompt sources and translation artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "memory-sync-mcp"
path = "src/main.rs"

[[test]]
name = "packaging_smoke"
path = "integration-tests/packaging_smoke.rs"

[dependencies]
tnmsd = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
testcontainers = { version = "0.27.3", features = ["blocking"] }
