[package]
name = "tnmsc-input-plugins"
description = "All 17 input plugins for tnmsc pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
tnmsc-logger = { workspace = true }
tnmsc-md-compiler = { workspace = true }
tnmsc-config = { workspace = true }
tnmsc-plugin-shared = { workspace = true }
tnmsc-init-bundle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
glob = { workspace = true }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }
