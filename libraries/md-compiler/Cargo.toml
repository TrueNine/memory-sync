[package]
name = "tnmsc-md-compiler"
description = "MDX to Markdown compiler with expression evaluation and JSX component processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
napi = ["dep:napi", "dep:napi-derive", "dep:regex-lite"]

[dependencies]
tnmsc-logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
markdown = { workspace = true }
json5 = "0.4.1"
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
regex-lite = { version = "0.1.9", optional = true }

[build-dependencies]
napi-build = { workspace = true }
