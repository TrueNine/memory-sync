[workspace]
resolver = "2"
members = [
  "cli",
  "libraries/logger",
  "libraries/md-compiler",
  "gui/src-tauri",
]

[workspace.package]
version = "2026.10222.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["TrueNine"]
repository = "https://github.com/TrueNine/memory-sync"

[workspace.dependencies]
# Internal crates
tnmsc = { path = "cli" }
tnmsc-logger = { path = "libraries/logger" }
tnmsc-md-compiler = { path = "libraries/md-compiler" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"

# CLI
clap = { version = "4", features = ["derive"] }

# Filesystem & system
dirs = "6"
glob = "0.3"

# Crypto & encoding
sha2 = "0.10"
base64 = "0.22"

# HTTP
reqwest = { version = "0.13", features = ["blocking", "json"] }

# Markdown / MDX
markdown = "1.0.0"

# NAPI-RS (Node.js native addon bindings)
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
napi-build = "2"

# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# JSON5 (for GUI log parsing compat)
json5 = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
