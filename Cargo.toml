[package]
name = "memory-sync"
description = "Cross-AI-tool prompt synchronisation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "memory-sync"
path = "src/main.rs"

[dependencies]
tnmsc = { path = "cli" }

[workspace]
resolver = "2"
members = [
  "xtask",
  "sdk",
  "cli",
  "cli/local-tests",
  "mcp",
  "gui/src-tauri",
]

[workspace.package]
version = "2026.10806.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
authors = ["TrueNine"]
repository = "https://github.com/TrueNine/memory-sync"

[workspace.dependencies]
# Internal crates
tnmsd = { path = "sdk" }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yml = "0.0.13"

# CLI
clap = { version = "4.6.5", features = ["derive"] }

# Filesystem & system
dirs = "6.0.0"
glob = "0.3.4"

# Crypto & encoding
sha2 = "0.11.0"
base64 = "0.23.0"

# HTTP
reqwest = { version = "0.13.4", features = ["blocking", "json"] }

# Markdown / MDX
markdown = "1.0.0"

# Tauri
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = { version = "2.6.3", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# JSON5 (for GUI log parsing compat)
json5 = "1.3.1"

# Tests
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
