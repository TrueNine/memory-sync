[workspace]
resolver = "2"
members = [
  "cli",
  "libraries/logger",
  "libraries/md-compiler",
  "libraries/script-runtime",
  "gui/src-tauri",
]

[workspace.package]
version = "2026.10328.106"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["TrueNine"]
repository = "https://github.com/TrueNine/memory-sync"

[workspace.dependencies]
# Internal crates
tnmsc = { path = "cli" }
tnmsc-logger = { path = "libraries/logger" }
tnmsc-md-compiler = { path = "libraries/md-compiler" }
tnmsc-script-runtime = { path = "libraries/script-runtime" }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yml = "0.0.12"

# CLI
clap = { version = "4.6.0", features = ["derive"] }

# Filesystem & system
dirs = "6.0.0"
glob = "0.3.3"

# Crypto & encoding
sha2 = "0.10"
base64 = "0.22.1"

# HTTP
reqwest = { version = "0.13.2", features = ["blocking", "json"] }

# Markdown / MDX
markdown = "1.0.0"

# NAPI-RS (Node.js native addon bindings)
napi = { version = "3.8.3", features = ["napi4"] }
napi-derive = "3.5.2"
napi-build = "2.3.1"

# Tauri
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-build = { version = "2.5.6", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

# JSON5 (for GUI log parsing compat)
json5 = "1.3.1"

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
